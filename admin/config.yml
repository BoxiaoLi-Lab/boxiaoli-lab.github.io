backend:
  name: github
  repo: BoxiaoLi-Lab/boxiaoli-lab.github.io
  branch: master
  base_url: https://sveltia-cms-auth.liboxiao19890504.workers.dev

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site_content"
    label: "网站内容管理"
    files:
      - file: "data/global.json"
        label: "⚙️ 全局页面文字设置"
        name: "global"
        fields:
          - {label: "导航栏名称", name: "nav_brand", widget: "string"}
          - {label: "底部版权", name: "footer_text", widget: "string"}
          - label: "主页顶部文字"
            name: "home"
            widget: "object"
            fields:
              - {label: "标题", name: "title", widget: "string"}
              - {label: "副标题", name: "subtitle", widget: "string"}

      - file: "data/news.json"
        label: "1. 新闻列表"
        name: "news"
        fields:
          - name: "items"
            label: "新闻列表"
            widget: "list"
            fields:
              - {label: "标题", name: "title", widget: "string"}
              - {label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
              - {label: "内容", name: "content", widget: "text"}
              - {label: "配图", name: "image", widget: "image", required: false}

      - file: "data/publications.json"
        label: "2. 论文列表"
        name: "publications"
        fields:
          - name: "items"
            label: "论文列表"
            widget: "list"
            fields:
              - {label: "年份", name: "year", widget: "string"}
              - {label: "标题", name: "title", widget: "string"}
              - {label: "作者", name: "authors", widget: "string"}
              - {label: "期刊", name: "journal", widget: "string"}

      - file: "data/members.json"
        label: "3. 成员列表"
        name: "members"
        fields:
          - name: "items"
            label: "成员列表"
            widget: "list"
            fields:
              - {label: "分类", name: "category", widget: "string"}
              - {label: "姓名", name: "name", widget: "string"}
              - {label: "角色", name: "role", widget: "string"}
              - {label: "简介", name: "detail", widget: "text"}

      - file: "data/researches.json"
        label: "4. 研究方向"
        name: "researches"
        fields:
          - name: "items"
            label: "研究列表"
            widget: "list"
            fields:
              - {label: "名称", name: "title", widget: "string"}
              - {label: "简介", name: "desc", widget: "text"}

      - file: "data/positions.json"
        label: "5. 招聘职位"
        name: "positions"
        fields:
          - name: "items"
            label: "职位列表"
            widget: "list"
            fields:
              - {label: "名称", name: "title", widget: "string"}
              - {label: "描述", name: "desc", widget: "text"}

      - file: "data/gallery.json"
        label: "6. 轮播图"
        name: "gallery"
        fields:
          - name: "images"
            label: "图片列表"
            widget: "list"
            fields:
              - {label: "图片", name: "url", widget: "image"}
              - {label: "描述", name: "alt", widget: "string", required: false}
